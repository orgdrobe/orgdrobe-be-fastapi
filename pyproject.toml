[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.1",
    "asgi-correlation-id>=4.3.4",
    "asyncpg>=0.31.0",
    "cashews>=7.5.0",
    "fastapi-mail>=1.6.2",
    "fastapi[standard]>=0.128.0",
    "passlib[argon2]>=1.7.4",
    "pyjwt[crypto]>=2.11.0",
    "sqlalchemy>=2.0.45",
    "structlog>=25.5.0",
    "typer>=0.21.1",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "types-passlib>=1.7.7.20260211",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto" 

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
python_version = "3.13"